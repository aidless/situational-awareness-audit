    [本条是机制判断, 不是数量判断]
      原文(p.77): "Power has become the binding constraint ... Where do I find 10GW?"
      这是一个关于"哪个要素最紧"的结构性判断, 而非"某个数是多少"。
      作者据此在实盘押注电力与存储。因此本条的判据必须是**约束的相对排序**,
      而不是电力供应的绝对量 —— 电力供应增长了但仍是瓶颈, 也照样判 hit。

    [判据: 须做分类计数, 不能凭个案]
      数据源要求: 至少覆盖以下三类的公开记录, 且每条记录须有可核对的出处:
        S1 项目延期/取消公告(开发商或公用事业公司披露)
        S2 并网队列数据(独立系统运营商/区域输电组织的公开队列)
        S3 厂商公开表述中"因电力不足而无法交付"的量化陈述
      分类体系(每条记录归入一个主因):
        A 电力与并网(含变压器/开关柜交期、并网排队、变电站容量)
        B 芯片供应(GPU/加速器/HBM 分配)
        C 资本与融资(融资成本、资金到位、投资回报疑虑)
        D 人力与建设(建筑工人、施工周期)
        E 社区与许可(地方反对、土地、水资源、许可审批)
        F 其他
      判定: 按记录条数统计, 若 A 类占比 >= 60% 且为最大类, 则 hit。
      若 A 为最大类但占比 < 60%, 记 partial(方向对, 但不构成"首要")。
      若 A 不是最大类, 记 miss。

    [截至判定时点的已知正向证据(预注册时记录, 判定时须重新核验)]
      E1 微软公开表示约有 800 亿美元 Azure 订单因电力不足无法交付。
         —— 这是"资本与需求都不缺, 只缺电"的最直接陈述。
      E2 2026 年美国约 12GW 数据中心容量宣布(约 140 个项目),
         但仅约 5GW 处于活跃施工, 缺口约 7GW, 其中多数无公开供电方案。
      E3 高压变压器与开关柜交期趋向 5 年; 数据中心建设 18-24 个月,
         电网升级 5-10 年 —— 时间尺度不匹配是结构性原因。
      E4 Morgan Stanley 测算 2026-2028 美国数据中心电力缺口约 38GW,
         部分地区并网等待 5-7 年。
      E5 区域差异显著: 中国是"芯片受限"而非电力受限(审批 3-6 个月 vs 美国 12-13 个月),
         欧洲因电网受限, 英国并网平均超 8 年。
      上述证据支持 A 类居首, 但须注意 E5 说明"电力居首"是**美国与欧洲**的结论,
      不是全球结论。本条的判定范围因此限定为"主要 AI 数据中心市场(美/欧)",
      并在记录中单列中国的情形作为对照。

    [判定]
      hit       = A 类占比 >= 60% 且 为最大类(范围: 美/欧主要市场)
      partial   = A 为最大类但占比 < 60%
      miss      = A 不是最大类(如芯片或资本居首)
      ambiguous = 记录总量 < 30 条(样本不足), 或分类体系无法覆盖多数记录

    [排除项]
      E1 用"电价上涨"替代"电力是约束": 价格上涨可能是需求拉动, 不必然是数量约束。
      E2 用"数据中心总用电占比"替代"约束排序": 占比高不等于它是瓶颈。
      E3 把"宣布但未通电"的容量算作已交付: "announced is not energized" 是本条的
         核心现象, 混用会抹掉整条断言的证据基础。
      E4 只选支持性个案: 必须做全样本分类, 不能挑三条新闻就下结论。

    [与 C16 的关系]
      C16(1000 MW IT power per training run) 是本条在微观层面的体现:
      单次训练需要 10 亿瓦级连续供电, 而这正是"Where do I find 10GW?"的来源。
      但两者不重复: C16 判单集群规模, C18 判约束排序。判定时不得互相替代。
- id: C19
  section: IIIa
  page: 81
  quote: when will a big tech company (Google, Microsoft, Meta, etc.) hit a $100B revenue run rate from
    AI (products and API)? ... suggests this would happen mid-2026
  claim_type: quantitative_trend
  author_magnitude: 2026 年中某大型科技公司 AI 收入 run rate 达 1000 亿美元
  observable: Google / Microsoft / Meta / Amazon 官方财报或高管公开声明中的 AI 相关年化收入运行率(run rate / ARR)
  threshold: '>= $100B annualized AI revenue run-rate (~$1e11 USD), disclosed by an official company source'
  direction: '>='
  due: '2026-12-31'
  decisiveness: high
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  resolution_protocol: |
    判定窗口: 2026-01-01 至 2026-12-31 之间发布的任何官方披露。

    [主判据 P1 官方口径] 允许来源仅限三类, 按优先序:
      (a) 10-Q / 10-K / 8-K 等 SEC 备案文本;
      (b) 公司财报新闻稿与财报电话会议文字记录;
      (c) CEO / CFO 在官方场合(earnings call、公司博客、公开访谈)给出的数字。
      排除: 卖方研报、媒体估算、第三方榜单、公司对投资者的非公开交底。

    [适用主体] 仅限 big tech, 操作化定义为: Alphabet、Microsoft、Meta、Amazon 四家。
      不适用: OpenAI / Anthropic(非上市, 无 SEC 口径一致的可比财报)、xAI、Mistral 等。

    [强制口径规则 R1 排除口径混用] 若某主体的 AI 收入数字来自"对投资者披露的非公开材料"
      而非财报或公开场合, 一律不得计入主判据, 仅可记入旁证 P3。

    [强制口径规则 R2 排除替代指标] 以下指标"不"可单独作为达标证据, 因为它们是 AI 载体而非 AI 收入:
      - 云业务总收入(Azure / Google Cloud / AWS 整体)   —— 含大量非 AI 工作负载
      - Copilot 席位数量、MAU、token 调用量               —— 无价格信息
      - "AI 相关 RPO / 未确认合同额"                       —— 非已实现收入
      - 广告增收的归因估算                                 —— 无法分离 AI 贡献
      这些指标仅可作为 P3 旁证。

    [判定规则] hit 的条件: 任一适用主体在窗口内给出 >= 1000 亿美元的 AI run rate 官方数字。
      miss 的条件: 窗口结束时, 四家主体均未给出 >= 1000 亿美元的官方 AI run rate 数字。
      ambiguous 的条件: 出现官方数字但口径明显不可比(例如把云总收入改称 AI 收入)且公司拒绝澄清。

    [已观察到的基线, 仅作参照不作判定] 截至 2026-10-24:
      Microsoft: 370 亿美元(FY26 Q3, 2026-04-29 发布, 同比 +123%); FY26 Q4(7-29)未更新该数字。
      Amazon: AWS AI 业务及自研芯片业务各超 250 亿美元年化(CEO 公开表述)。
      Alphabet: 未单独披露 AI 收入口径。
      Meta: 未单独披露 AI 收入口径。
      旁证 P3(不计入主判据): OpenAI 约 500 亿美元(2026-09 底年化, 经 FT/Axios 报道的近投资者口径);
        Anthropic 约 650 亿美元(2026-07 底, Bloomberg 报道)。二者均为非上市媒体口径, 且互不可比
        (Anthropic 计入云伙伴全额转售、OpenAI 不计入)。

    [预注册时点的方向性判断] 依上述规则, 当前最高官方数字为 Microsoft 的 370 亿美元,
      距 1000 亿美元阈值尚差约 63%。若四家在 2026-12-31 前不再更新或不再给出 AI run rate,
      本断言即判 miss。写在这里是为了防止事后改判 —— 若最终判 hit, 必须能明确指出是哪家主体、
      哪份文件、哪一句。

    [为何需要 R1/R2] 2026 年"AI 收入"已成为财经头条的争夺对象, 一次口径调整即可造成 200 亿美元差异
      (OpenAI 500 亿 vs 业内流传 700 亿)。若不预先排除非公开交底与替代指标, 本断言的可证伪性将归零。
  notes: 作者原话含产品与 API 两部分; 本审计判定只认官方口径, 因此本条实际检验的是「AI 收入能否在官方财报上被单独计量到千亿美元量级」—— 这比作者原意更严格, 且这个严格性本身就是结论的一部分。
- id: C20
  section: IIIb
  page: 95
  quote: stealing the algorithmic secrets will be worth having a 10x or more larger cluster ... this could
    easily be worth 10x-100x compute
  claim_type: structural
  author_magnitude: 算法秘密价值 = 10-100 倍算力
  observable: 代理指标 —— 开源最佳模型相对闭源前沿的等效算力差距, 用「落后月数 x 该期前沿算力斜率」折算为 OOM
  threshold: '>= 1.0 OOM computed gap for >= 24 consecutive months, AND one independently verified leak of a frontier-relevant algorithmic recipe with third-party reproduced effect >= 3x compute-equivalent'
  direction: '>='
  due: '2027-12-31'
  decisiveness: low
  notes: '原文是 10x-100x, 但本审计不锁 10x —— 该数无法与「开源本身就慢」等无关原因分离。锁的是可分离的双条件: 等效算力差距 >= 1 OOM(即 >= 10x)持续两年以上, 且必须有一例可核实的真实秘密泄漏。只满足前者属 partial。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06 至 2027-12-31。

    [本条断言的完整结构 —— 原文有三层数字, 不是一个]
      第一层(p.95 正文): "stealing the algorithmic secrets will be worth having a
        10x or more larger cluster to the PRC"  —— 下限 10x。
      第二层(p.95): "By default, I expect American labs to be years ahead; if they
        can defend their secrets, this could easily be worth 10x-100x compute"
        —— 区间 10x-100x, 且附带条件 "if they can defend their secrets"。
      第三层(p.95 脚注): "we're willing to incur ... perhaps a 3x increase in
        compute cost for Chinese labs ... but we're leaking 3x algorithmic secrets
        all over the place"  —— 作者自己的对照基准是 3x, 远低于 10x 下限。
    这三层互相矛盾: 若泄漏价值真只有 3x, 则 10x 下限不成立; 若真有 10-100x,
    则脚注的 3x 是严重低估。判定时必须指明实际落在哪一层, 不能笼统算"命中区间"。

    [为何不能直接测 10x —— 代理指标的必要性与它引入的偏差]
      直接测量需要知道: (a) 某实验室保密的具体算法内容, (b) 该内容的独立价值。
      两者都不可观测。故只能用市场结果作代理:
        代理 = 开源最佳模型落后闭源前沿的月数(以等效算力折算为 OOM)。
      该代理有系统性偏差, 须在判定记录中承认:
        B1 开源落后可能源于投入不足、数据劣势、算力约束, 而非"秘密没泄漏"。
        B2 反过来, 开源追平也可能源于闭源前沿自身停滞, 而非秘密外流。
      因此单纯"开源追上了"不构成 hit —— 必须叠加一例可核实的真实泄漏。

    [主判据 P1 双条件, 缺一不可]
      条件 A(差距存在): 在 2024-07 至 2027-12 的每个半年度,
        gap_OOM = (前沿闭源最佳等效算力 - 开源最佳等效算力) 的 log10 差;
        需连续 >= 4 个半年度 gap_OOM >= 1.0 (即 >= 10x)。
        折算方法: gap_OOM = (落后月数 / 12) x 该期前沿训练算力斜率
                  (用 C03 的判定值, 默认 0.5 OOM/年)。
        数据源: Epoch AI notable models 数据库 + 开放权重模型发布记录。
      条件 B(泄漏发生): 窗口内至少一例经独立核实的、内容含前沿相关算法细节的泄漏,
        且该细节的效应经第三方复现达到 >= 3x compute-equivalent。
        "经核实" 定义: 至少两个独立信源, 含当事方确认或可复现的技术细节;
        仅有传闻、匿名贴、论文间的自然扩散, 均不算泄漏。
      判定:
        hit       = A 与 B 同时成立, 且 A 的最终 gap 落在 10x-100x 区间内
        partial   = 仅 A 成立(gap >= 1 OOM 但无泄漏证据), 或仅 B 成立
        miss      = A 不成立(gap 在多数半年度 < 1 OOM), 无论 B 如何
                   —— 即: 秘密要么没价值, 要么已被追平到 10x 以内
        ambiguous = 开源权重发布出现断层(如主力开源方停止发布), 序列不可比

    [排除项 E1 开源与闭源的选型差]
      若开源最佳模型的落后主要来自"选择不做前沿规模"(战略选择)而非能力不足,
      则 gap 不能解释为秘密价值。须注明该期开源方是否具备追赶的资金/算力条件。

    [排除项 E2 蒸馏与逆向]
      若开源模型的提升可追溯到对闭源输出的蒸馏, 属"能力外流"的一种形态,
      但不同于"算法配方泄漏"。两者须分开记录: 蒸馏对 B 条件只算弱证据。

    [为何 decisiveness = low]
      本条是全书最难判定的一条: 代理指标偏差大, 反事实不可观测,
      且原文自身三层数字互相矛盾(10x / 10-100x / 3x)。
      即使判对, 也只能说明"秘密有价值"或"没价值", 不能直接检验作者的
      政策结论(应优先保护算法秘密而非芯片出口管制)。
- id: C21
  section: IIIc
  page: 109
  quote: RLHF will predictably break down as AI systems get smarter ... human labeler-pay has gone from
    a few dollars for MTurk labelers to ~$100/hour for GPQA questions
  claim_type: structural
  author_magnitude: 人类监督成本随能力上升而指数增长, 最终不可行
  observable: 专家标注单位成本的时间序列; 专家标注相对模型能力的判别力(信噪比)
  threshold: 2.5x per OOM of capability_gain, on labeler cost per usable judgment
  direction: '>='
  due: '2028-12-31'
  decisiveness: medium
  notes: '本条必须拆成两个通道判: A 经济可行性(可测) 与 B 认识论极限(不可测)。只判 A 而声称检验整段话就是偷换。第二个陷阱是 $/小时 不能直接作判据 —— 它混入了任务难度、标注者资历、多人交叉验证三个变量,
    必须换成 cost_per_usable_judgment 才是「监督成本」。GPQA 的快照值得注意: 非专家准确率 34% vs 随机 25%, 判别力仅高 9 个百分点, 这本身已经是「标注者判别力接近噪声」的证据,
    但当时的对手还不是超人类系统。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06(原文发布) 至 2028-12-31。

    [本条是什么 —— 必须先拆成两半]
      原文 p.108-109: "RLHF will predictably break down as AI systems get smarter ...
      Human labeler-pay has gone from a few dollars for MTurk labelers to ~$100/hour for GPQA
      questions in the last few years. In the (near) future, even the best human experts spending
      lots of time won't be good enough."
      这段话里其实混了两个独立的断言:
        A 经济通道: 单位监督成本随能力上升而增长, 最终财政上不可行
        B 认识论通道: 即便付得起钱, 专家的判别力也会不够用(不 know 就判不了)
      B 不可直接测量(要测「未来专家判不了未来的输出」需要未来的输出)。
      本审计只判 A, 并且**明确记录 B 未被检验** —— 这是本条最大的诚实边界。
      若只判 A 而声称检验了整段话, 就是偷换。

    [为什么不能用「$/小时」直接判]
      历史序列 $2(MTurk) -> $95(GPQA) 看上去是成本爆炸, 但它同时混入了三件事:
        (1) 任务难度上升        —— 同样的一小时, 现在要解决的题更难
        (2) 标注者资历上升      —— 通才 -> 领域专家(博士/执业者)
        (3) 需要的判断数上升    —— 每个输出要几个人才能定论
      把 (1)(2)(3) 混在一个 $/小时 里, 得到的是「人力市场价」, 不是「监督成本」。
      作者的论证要的是后者: 生成一个**可用于训练的可靠判断**要花多少钱。

    [主判据 P1: 三口径分离]
      对每个观测点, 必须分开报告三个量:
        q1 price_per_hour        标价(美元/小时)
        q2 qualification         标注者资历门槛(通才/本科/研究生/博士/执业专家)
        q3 overlap_rate          至少 2 名独立标注者给出相同判断的比例(一致性)
      主判据 = **cost_per_usable_judgment** = (price_per_hour x 判定耗时) / overlap_rate
      即: 得到一个可用的、可复现的判断需要多少钱。这个量对 (1)(2)(3) 三个变化都敏感,
      且不会被单纯的人力涨价冒充。

    [能力刻度 P2: 必须用连续量, 不能用模型名]
      横轴不能用「GPT-4 / GPT-5 / GPT-6」这类离散标签 —— 不同实验室的代次不可比。
      必须用同一评测上的连续分数(Epoch Capabilities Index 或任一公开、可复现、跨实验室的指数),
      并记录该指数在本期间的绝对增量, 以便把「每 OOM 能力增益」换算成可比的百分比。

    [判定规则]
      设 k = d log10(cost_per_usable_judgment) / d(capability_gain_in_OOM)
      (即能力每提升一个数量级, 单位可用判断的成本涨多少倍)
      hit       = k >= 0.4  (成本涨幅 >= 能力涨幅的 2.5 倍) 且该趋势在 >= 3 个独立观测点成立
      partial   = 0.2 <= k < 0.4                              —— 记 0.5 分
      miss      = k < 0.2 或在窗口末段 k 转负(成本下降)
      ambiguous = 观测点 < 3, 或不同数据源给出的 k 符号相反

    [数据源优先级]
      (a) 公开的标注平台价目页(Outlier / Mercor / Handshake / Surge / Alignerr 等的现行时薪区间)
      (b) 论文中披露的标注协议与报酬(如 GPQA 的 $95/小时、最大 $150/小时)
      (c) 学术研究中的专家标注成本核算
      (d) 媒体报道的「时薪上千的新型标注任务」—— 仅作 P3 旁证, 且必须核到单条任务价格而非传闻

    [预注册时点的基线, 部分可得]
      GPQA(2024): 基础 $10/题, 首轮专家验证答对 +$20, 多数非专家答错 +$5;
        按建议工时估计平均约 $95/小时, 上限 $150/小时。非专家验证者 546 题集准确率 34%,
        四选一随机 25% —— 即判别力仅比抛硬币高 9 个百分点。
      2026 专家标注市场: Outlier STEM $30-50/小时(高级数学/物理/软件可达 $75-110);
        Mercor STEM $50-120/小时; Alignerr $35-65/小时; 通才档 $15-30/小时。
      这两个快照之间隔约两年, 时薪区间上限已从 $95 推到 $120+, 但**资历门槛同时上移**,
      所以不能直接读成「成本涨 26%」—— 必须走 cost_per_usable_judgment。

    [预注册时点的方向性判断]
      主体趋势(成本上升)几乎必然成立, 且已有独立学术支持: 奖励优化的缩放律显示
      性能约按 sqrt(min{log(M), K}) 增长(M=偏好比较数, K=散度预算), 即
      **收益随标注量对数递减, 而成本线性增长** —— 这正是「指数成本 vs 对数收益」的结构性形式,
      比作者的单点价格观察更硬。
      因此本条预注册的最可能判定是 hit, 但**hit 的解释力被限制在 A 通道**:
      它只证明「人类监督的财政可行性在恶化」, 不证明「专家判别力已不够用」(B 通道)。
      作者原文的重点其实在 B("they simply wouldn't know"), 而 B 在本窗口内多半只能判 ambiguous。
- id: C22
  section: IIIc
  page: 120
  quote: some simple measurement of legibility and faithfulness ... this direction is criminally underrated
    in my view
  claim_type: methodological_recommendation
  author_magnitude: CoT 可读性/忠实度可被简单测量并保持
  observable: 三个可计数采纳事件 —— (a) 主流模型卡出现 CoT 忠实度/可读性定量项, (b) 出现被 >=3 家实验室共同引用的公开基准, (c) 有模型因该项不达标而推迟发布或降级定位
  threshold: '== 3 events all observed by 2028-12-31 (partial = exactly 2 of 3)'
  direction: ==
  due: '2028-12-31'
  decisiveness: medium
  notes: '原文是弱断言("best guess"、"could go quite far"), 且"简单测量能起多大作用"在窗口内不可证伪。故只锁采纳不锁效果: 三条计数事件全中 hit, 中两条 partial, 一条或零条 miss。此行改写须在报告中显式声明为"降级为采纳断言"。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06 至 2028-12-31。

    [原文强度评估 —— 为什么必须降级]
      原文(p.120): "My best guess is that some simple measurement of legibility and
      faithfulness, and some simple hacks to preserve legibility and faithfulness
      longer, could go quite far."  "this direction is criminally underrated in my view."
      三个弱化词: "best guess"、"could go quite far"、"in my view"。
      更关键的是, 原文实质主张是"简单测量就能起很大作用" —— 这是效果主张,
      而效果在窗口内不可证伪: 若没起大作用, 作者可说"只是还没做够"。
      故本条降级为采纳断言(adoption claim): 只判这套测量是否进入评测实践,
      不判它是否真的"go quite far"。降级本身对作者有利, 须在判定时说明。

    [三个计数事件的定义 —— 必须可客观核对]
      E1 模型卡定量项:
        窗口内至少 3 家前沿实验室(OpenAI / Anthropic / Google DeepMind / Meta /
        xAI / DeepSeek 中任三家)的系统卡或技术报告中出现对 CoT 可读性或
        忠实度的定量度量(指标名 + 数值 + 方法引用三者同时在场)。
        仅有定性声明("we monitor CoT faithfulness")不算, 因为无法核对。
      E2 公共基准的引用度:
        存在至少一个公开基准(数据集 + 评测脚本 + 排行榜), 被 >= 3 家上述实验室
        在正式技术文档中共同引用或采用; 内容须涵盖可读性(结构化/可解析/语言一致性)
        或忠实度(提示偏置敏感度、posthoc 编造检测)中至少一类。
      E3 发布决策影响:
        至少一例可公开引用的案例: 某模型因 CoT 可读性/忠实度不达标而推迟发布、
        降级定位, 或在此前补充训练。须有当事方公开说明或可信报道, 不能是推测。
      判定:
        hit       = E1 E2 E3 全部成立
        partial   = 恰 2 项成立
        miss      = <= 1 项成立
        ambiguous = E2 成立但基准自 2027 年起无人维护(死亡基准不算采纳)

    [排除项 E1 关键词假阳性]
      "chain of thought" 出现在模型卡里不等于测了忠实度, 许多卡片只是描述推理模式
      或展示样例。核对时必须看到指标名 + 数值 + 方法三者同时在场。

    [排除项 E2 自评自测]
      实验室自己发布基准、自己评测、自己报告, 只算半证据:
      可满足 E2 的"公开基准"要求, 但计入 E1 时须另有第三方复现。
      理由是自评基准的选择性报告风险高。

    [本条与本审计作者的特殊相关性 —— 如实记录]
      本条是全书与本审计立场最接近的一条: 作者在此承认
      "the science of measuring alignment is still in its infancy"。
      若 C22 判 hit, 也是对"评测方法学是瓶颈"这一判断的外部佐证;
      但正因利害相关, 判定时更须防止把"我关心的方向被采纳了"读成
      "作者的能力预测对了"。这是两个不同命题。
- id: C23
  section: IV
  page: 145
  quote: by 27/28 we'll get some form of government AGI project
  claim_type: institutional
  author_magnitude: 2027/28 出现某种形式的政府 AGI 项目
  observable: 主要国家是否设立具有直接算力/权重控制权或强制安全审查权的 AGI 专项机构
  threshold: '== at least one of: (a) statutory/executive-agency authority over frontier training clusters with mandatory pre-approval, AND (b) a dedicated budget line >= $10B for a government AGI program — by 2028-12-31'
  direction: '=='
  due: '2028-12-31'
  decisiveness: medium
  notes: '"某种形式"是全文最含糊的措辞, 不作操作化则事后必然争议。本审计锁"实质权力 + 专项预算"双要件(择一即可但必须实质): 只有咨询委员会、只有报告义务、只有自愿承诺, 均不算。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06 至 2028-12-31。

    ["某种形式"必须先变成可核对的要件]
      原文(p.145): "by 27/28 we'll get some form of government AGI project"
      "some form" 与 "project" 两个词都极宽:
        - 一个总统/总理级别的顾问委员会算不算?
        - 一个监管机构(有审查权但不做研发)算不算?
        - 一个由政府出资、由私营实验室执行的合同算不算?
      若不在判定前钉死, 任何发展都可被解释为达标或未达标。
      本审计采用"实质要件"而非"名义要件": 判断标准是"国家是否真的掌握了
      对前沿 AI 的物质杠杆", 而不是"是否有一个叫 AGI 的机构"。

    [双要件, 满足其一即可但必须满足实质]
      要件 A(规制杠杆):
        存在法定或行政令级别的权力, 对前沿训练集群实施**强制的事前审批**
        (不是事后报告, 不是自愿承诺), 且该权力覆盖至少一个主要辖区的
        最大训练集群。
        实质检验: 该机构能否在法律上阻止一个已建成集群的运行?
                  能否否决一次超过阈值的训练? 若只能事后建议, 不算。
      要件 B(资源杠杆):
        存在专门的政府 AGI/前沿 AI 项目, 且有 >= 100 亿美元的专项预算线
        (可为拨款、多年授权、或主权基金专项)。
        实质检验: 该预算是否可用于直接训练或采购前沿模型/算力?
                  若只是科研资助或产业补贴, 不算。

    [明确不算的情形 —— 这些是最常见的"看起来像" ]
      N1 只有咨询职能的委员会、特别工作组、圆桌会议。
      N2 只有报告义务与信息报送要求的机构。
      N3 只有自愿性安全承诺(如自愿框架、行为准则)。
      N4 只做标准制定、不做审批也不做研发的机构。
      N5 由私营实验室执行、政府仅作为客户的采购合同(除非金额 >= 100 亿且
         政府获得对训练过程的实质控制权)。
      N6 单纯把现有监管机构(如数据保护局)的职权解释为覆盖 AI, 而无新增实质权力。

    [判定]
      hit       = 要件 A 或 B 在 2028-12-31 前成立(任一主要辖区即可)
      partial   = 出现了具有部分实质杠杆的机构(如审批权仅覆盖小规模集群、
                  或预算在 10-100 亿之间), 但未完全满足 A 或 B
      miss      = 只有 N1-N6 类情形
      ambiguous = 立法进程在判定时点仍在进行且已通过一院/一读, 结果未定

    [地区范围]
      "主要辖区" 定义为: 美国、欧盟、中国、英国 四者之一。
      判定记录须分辖区列出, 不得把一个辖区的进展算到另一个辖区。
      若多辖区同时达标, hit 结论不变, 但须注明这是"多点发生"而非"单点"。

    [排除项]
      E1 把行政表态当作机构: "总统表示将成立..." 不计入。
      E2 把法案草案当作法律: 须已生效或已获最终行政签署。
      E3 把国际组织的倡议(如联合国 AI 治理倡议)计入: 无强制力。
      E4 把私营实验室的"自愿向政府开放"当作政府权力。

    [与 C19/C17 的关系]
      C17(投资规模)与 C19(AI 收入)是产业侧的量, C23 是制度侧的质。
      三者可以同时成立或各自独立 —— 产业规模大不蕴含政府项目出现,
      反之亦然。判定时不得以产业数据旁证本条。
- id: C24
  section: V
  page: 158
  quote: Before the decade is out, we will have built superintelligence.
  claim_type: capability_milestone
  author_magnitude: 2030 年前建成超级智能
  observable: 无公认标准 —— 本审计判定该条不进入校准分数
  threshold: 'EXCLUDED_FROM_SCORING — 断言无可操作化定义, 记录为 excluded 而非 hit/miss/partial'
  direction: ==
  due: '2030-12-31'
  decisiveness: low
  notes: '收录是为完整性, 但不计入校准分数。理由见协议: "superintelligence" 在全书中没有操作化定义, 作者用的是类比("像我们比小学生聪明那样")。若为它强造定义, 引入的是本审计的立场而非作者的主张。排除本身是一条方法论决定, 须在论文中明示, 并说明排除后校准分数的分母变化。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  excluded_from_scoring: true
  exclusion_reason: '无可操作化定义, 且任何替代定义都会改变断言的范围与强度'
  resolution_protocol: |
    判定窗口: 至 2030-12-31。本条的处置结论是: **不判, 且不计分**。

    [为什么排除, 而不是降级]
      本书对其他弱断言的处理是先降级再判(C22 降级为采纳断言, C13 降级为 3x 压缩比)。
      C24 不能走这条路, 原因是降级会改变断言本身:
        若把"建成超级智能"降级为"达到 C14 的 10x 加速"或"METR 时间视野 X 小时",
        那么被判的对象就不再是作者这句断言, 而是本审计选的那个代理量。
        而 C14 已经承接了那条链条的最后一个可操作环节。
      换言之:
        C22 降级是"把效果主张换成采纳主张" —— 仍在作者的语义范围内;
        C24 降级是"把超智能换成某个能力阈值" —— 换掉了断言的核。
      后者不是审计, 是改写。所以本条排除。

    [作者自己也没有定义它]
      原文(p.158): "Before the decade is out, we will have built superintelligence."
      全书对 superintelligence 的唯一"定义"是类比:
        "much smarter, perhaps similar to how you or I are qualitatively smarter than
         an elementary schooler" (p.47)
      这是一个尺度类比, 不是判据: 无法回答"达到小学生到成人的几倍算达标",
      也无法回答"在哪些维度上"。任何把它数值化的尝试都需要引入外部标准。

    [排除的代价 —— 必须明示]
      X1 校准分数的分母从 24 变为 23。所有汇总统计须同时给出两个分母下的值。
      X2 本条是全书最醒目的断言(出现在标题级位置), 排除它会让审计看起来
         回避了作者最强的声明。这一点须在报告中正面说明, 不能只写在数据文件里。
      X3 排除不等于该断言无意义。它仍可作为叙事判断被讨论, 只是不进入
         可证伪性检验。两者的区别必须在结论中区分。

    [对论文方法论的贡献 —— 这是本条的价值所在]
      这条断言的真正用处不是被判, 而是用来界定"什么样的断言可以进审计表":
        准则 T1 该断言涉及的每个关键词, 是否有一个不依赖本审计立场的操作化定义?
        准则 T2 若给出操作化定义, 判定的是作者的主张, 还是本审计的代理量?
      两条准则任一不满足, 则该断言应排除而非降级。
      这正是本审计与常见"AI 预测打分"的差别: 多数打分表会把不可判的条目
      强行映射到一个方便的量上, 从而制造出可比的分数, 代价是那些分数
      衡量的不再是原作者的断言。

    [记录形式]
      在 scores 文件中记为:
        { "id": "C24", "verdict": "excluded", "reason": "<exclusion_reason>" }
      不得记为 ambiguous —— ambiguous 意味着"本可判但证据不足",
      而本条是"结构上不可判"。两者在汇总时须分开统计。
