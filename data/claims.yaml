      若对比的两臂来自不同代模型(如用 2024 年模型比 2026 年模型),
      进步会被误记为 CoT 折算率。必须同族同代。

    [排除项 E2 训练期 CoT 污染]
      若训练数据已大量包含 CoT 样式, "无 CoT 臂"本就具备部分能力, 折算率被压小。
