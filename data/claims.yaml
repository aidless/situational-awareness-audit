  resolution_protocol: |
    判定窗口: 观察期 2024-06-06 至 2027-12-31。

    [原文链条与它已过期的原因]
      原文(p.30): "CoT started being widely used just 2 years ago and can provide the
      equivalent of a >10x effective compute increase on math/reasoning problems"
      source_tier = C: 这是作者对当时文献的综述性判断, 无单一出处。
      问题在于: 2024 年后主流模型默认已内置 CoT / 推理模式,
      "关掉 CoT 的同一模型"这个对照组在实践中基本消失。
      若照字面做"开/关"对照, 2027 年只可能选到老模型, 结论无法外推到前沿。

    [因此采用的替代测量 —— 且必须承认它会压小折算率]
      替代设计: 在**同一模型**上, 用推理预算(thinking tokens 上限)作阶梯,
      测达到固定准确率所需的最少预算, 与"若把该预算换成预训练算力"作比较。
      这个替代会系统性低估 CoT 折算率, 因为:
        D1 内置 CoT 的模型即使预算很小也在用某种思维链, "零 CoT"臂不存在。
        D2 预算阶梯在模型已饱和的基准上无区分度。
      故 hit 门槛下调到 0.5 OOM(3.16x), 是对该替代设计的补偿。

    [主判据 P1 复现步骤]
      S1 冻结一个数学基准(MATH L5 或 AIME 近三年真题), 阈值取该基准上
         当时 SOTA 准确率的 80%(避免顶端饱和)。
      S2 在同一模型家族内, 扫 thinking budget(如 0 / 1k / 8k / 32k tokens),
         记录达到阈值所需的最小预算 b_min。
      S3 用同族规模-能力曲线反查: 无推理预算的基座要达到同准确率需多少倍参数量,
         折算为 OOM, 得 R_raw。
      S4 记录 b_min 期的实际部署成本, 与直接放大模型的成本比较, 得 R_cost。
      判定用 R1 = min(R_raw, R_cost):
