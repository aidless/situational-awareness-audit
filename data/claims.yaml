- id: C11
  section: I
  page: 37
  quote: if we could unlock +4 OOMs of test-time compute, that might be equivalent to +3 OOMs of pretraining
    compute
  claim_type: conversion_factor
  author_magnitude: '测试时算力 : 训练算力 兑换率 —— Jones 2021 Hex 实验为 1.2:1; 作者外推为 4:3 (1.33:1)'
  observable: 语言模型上, 为达到固定能力所需增加的测试时算力 OOM 与可替代的训练算力 OOM 之比
  threshold: '>= 1.15 : 1 exchange ratio on a language-model benchmark'
  direction: '>='
  due: '2027-12-31'
  decisiveness: high
  source_tier: B
  notes: '两个数必须分开记: p.36 Figure 18 的 Jones(2021) Hex 实验是 1.2 OOM 测试时约 1 OOM 训练 = 1.2:1; p.37 作者外推到语言模型写成 +4 约 +3 = 1.33:1。锁 1.15:1 是取两者下沿, 使判据同时覆盖原生值与外推值。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  group: G1_conversion_rates
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06 至 2027-12-31。

    [两个不同的数, 不能混为一谈]
      数一(p.36, Figure 18, Jones 2021, Hex 游戏, 实测):
        "one can spend ~1.2 OOMs more compute at test-time to get performance
         equivalent to a model with ~1 OOMs more training compute"
        => 兑换率 = 1.2 / 1.0 = 1.20 : 1
      数二(p.37, 作者对语言模型的外推):
        "if we could unlock +4 OOMs of test-time compute, that might be equivalent
         to +3 OOMs of pretraining compute"
        => 兑换率 = 4 / 3 = 1.33 : 1
      作者用 "very roughly" 连接两者, 但 1.20 与 1.33 是两个量级指标:
      前者是棋盘游戏实测, 后者是语言模型上的猜测。判定时必须分别报告,
      不得只报一个数然后宣称"与作者一致"。

    [兑换率的含义方向 —— 这是最容易搞反的地方]
      兑换率 = 测试时 OOM / 训练 OOM。
      兑换率 > 1 表示: 要替代 1 OOM 训练算力, 需花超过 1 OOM 的测试时算力 ——
      即测试时算力更"贵"、效率更低, 需要更多倍才能打平。
      兑换率 < 1 表示测试时算力更划算, 这对作者论点更有利(更容易解锁)。
      本审计锁 >= 1.15, 即要求"测试时替代训练至少需要 1.15 倍投入"。
      若实测 < 1, 属 miss —— 因为那意味着测试时算力远比作者设想的划算,
      作者的"unhobbling 是主要杠杆"这一判断会显得过于保守, 而非成立。

    [主判据 P1 复现步骤]
      S1 选一个语言模型基准(建议 MATH L5 + GPQA Diamond 双报), 冻结阈值。
      S2 两个臂:
         臂 T: 固定训练规模 M0, 增加测试时算力(thinking budget / 采样数),
               记录达到阈值所需测试时算力 T*。
         臂 P: 固定测试时算力最小, 增加训练规模, 记录达到阈值所需规模 M*。
      S3 兑换率 = log10(T*/T0) : log10(M*/M0), 其中 T0 是该基准的基线测试预算。
      S4 若两臂在阈值处均饱和, 换更难阈值重做。
      判定:
        hit       = 兑换率 >= 1.15 : 1
        partial   = 1.0 <= 兑换率 < 1.15
        miss      = 兑换率 < 1.0 (测试时算力比作者设想的更划算)
        ambiguous = 基准饱和, 或 T* 与 M* 中任一无法反查

    [排除项 E1 从棋盘游戏外推的跳跃]
      Hex 是完美信息、可模拟、单目标的博弈; 语言任务是开放、不可模拟、多目标的。
      作者自己用 "If a similar relationship held in our case" 做了标记。
      判定记录必须明确写出: 本条检验的是**语言模型上**的兑换率,
      不是复现 Hex 的结果。若只在 Hex 类环境里做到 1.2:1, 不构成对语言模型的证据。

    [排除项 E2 训练时与测试时的算力单位不可直接相加]
      训练 FLOP 与推理 FLOP 不同价(推理有人均摊、批处理、摊销折旧)。
      若用美元而非 FLOP 作单位, 兑换率会随部署量变化。
      故本协议统一用 FLOP, 并在记录中单列"若按美元计"的旁证值。

    [组内关系]
      属 G1 组。本条 decisiveness = high, 是组内可判定性最高的一条:
      它不依赖"脚手架定义"或"偏好评判者"这类模糊对象, 只依赖两个可扫的预算轴。
      因此在组汇总(C02)中, 本条的权重应高于 C06/C08。
- id: C12
  section: II
  page: 50
  quote: that would let us run many millions of copies of our automated AI researchers, perhaps 100 million
    human-researcher-equivalents
  claim_type: quantitative_trend
  author_magnitude: 2027 年约 1 亿研究员等价物(作者脚注 36 给出 2 亿全量, 预留一半为 1 亿)
  observable: '三级连乘: 推理 GPU 数 x (tokens/$) x (1/人类等效 token 速率), 再乘以 GPU 预留比例'
  threshold: '>= 1e7 human-researcher-equivalents (10 million), 即作者量的十分之一'
  direction: '>='
  due: '2027-12-31'
  decisiveness: medium
  notes: '本审计锁 1e7 而非 1e8: 该式为三级连乘, 每级都有独立误差, 且对 tokens/$ 极度敏感(每改善 10 倍结果差一个 OOM)。作者在脚注 35 假设 $/token 大致不变, 这是全式最弱的一环。锁 1e7 后仍要求报告误差传播区间与逐级分解。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06 至 2027-12-31。

    [原文的完整计算链 —— 这是全表唯一可逐级算术复核的断言]
      正文(p.50): "That would let us run many millions of copies of our automated AI
      researchers, perhaps 100 million human-researcher-equivalents, running day and night."
      脚注 36 给出全部中间步骤:
        "GPT4T is about $0.03/1K tokens. We supposed we would have 10s of millions of
         A100 equivalents, which cost ~$1 hour per GPU if A100-equivalents.
         ... that implies 10s of millions GPUs * $1/GPU-hour * 33K tokens/$ = ~ one
         trillion tokens/ hour. Suppose a human does 100 tokens/min of thinking,
         that means a human-equivalent is 6,000 tokens/hour. One trillion tokens/hour
         divided by 6,000 tokens/human-hour = ~200 million human-equivalents ...
         (And even if we reserve half the GPUs for experiment compute, we get 100
         million human-researcher-equivalents.)"

    [本审计的算术复核结果 —— 作者在自身假设下是对的]
      取 GPU = 3e7(即 "10s of millions" 的中值), $1/GPU-hour, 33K tokens/$:
        tokens/hour = 3e7 x 1 x 3.3e4 = 9.9e11  (作者写 ~1e12, 三舍五入无误)
        human-equiv = 100 tokens/min x 60 = 6,000 tokens/hour
        全量 = 9.9e11 / 6,000 = 1.65e8      (作者写 ~2e8, 偏高一档但同量级)
        预留一半 = 8.25e7                    (作者写 1e8, 同量级)
      结论: 算术正确。这条断言的问题不在算术, 在假设。

    [为什么本审计锁 1e7 而不是 1e8]
      该式是三级连乘, 每级各有一个独立自由参数, 且各自误差相加(对数域):
        级 1 推理 GPU 数量: 作者取 "10s of millions"。若实际 1e7(一千万),
             结果直接掉一个量级: 2.75e7。
        级 2 tokens/$: 作者取 33K(基于 GPT-4T 的 $0.03/1K)。
             **这是全式最敏感也最脆弱的一级** —— 见下段。
        级 3 人类等效速率: 100 tokens/min。这就是 C10 已被判为"无出处"的承重墙。
             若真实是 50 或 200, 结果差 2 倍(C10 的 in_range [50,200] 直接覆盖)。
      三级各差 2-10 倍, 合成后 1e8 可轻易漂到 1e7 或 1e9。
      锁 1e7 是"作者量降一个量级", 属显著宽松化, 须在判定时说明。

    [最敏感的一级: tokens/$ 的假设 —— 作者自己知道, 且给了理由]
      脚注 35 明确处理过这个问题:
        "On Chinchilla scaling laws, model size—and thus inference costs—grow with the
         square root of training cost, i.e. half the OOMs of the OOM scaleup ...
         algorithmic efficiency was advancing at roughly the same pace as compute
         scaleup ... If these algorithmic wins also translate into inference efficiency,
         that means that the algorithmic efficiencies would compensate for the naive
         increase in inference cost. ... So, at least in terms of the rough ballpark,
         assuming the $/token of frontier models stays roughly similar doesn't seem crazy."
      这个论证是自洽的, 但它把两个独立的量绑在了一起:
        (a) 算法效率进步  -> 若传导到推理, 则抵消模型变大带来的成本上升
        (b) $/token 不变   -> 于是 tokens/$ 不变
      弱点: 若算法进步没有充分传导到推理(作者自己在脚注里承认 "often, but not always"),
      则 $/token 会上涨, tokens/$ 下降, 结果变小; 反之若推理优化快于训练优化
      (2024-2026 的实际观察), 则 tokens/$ 上升, 结果变大。
      本协议要求: 判定时必须用**实测 tokens/$** 而非假设值, 并报告
      "若 tokens/$ 相比 33K 变动 10 倍, 结果如何变化" 的敏感度。

    [主判据 P1]
      S1 取判定时点的前沿推理 GPU 总量(须写明数据源: 厂商披露 / 第三方估算 /
         算力存量推算), 换算为 A100-等效, 记录数量级。
      S2 取同期前沿模型的实测 tokens/$(用公开 API 定价, 同一上下文档, 同一 batch 模式;
         须剥离促销与限时折扣)。
      S3 人类等效速率直接引用 C10 的判定值(本审计已锁 in_range [50, 200]);
         若 C10 尚未实证, 用作者值 100 并声明为作者假设。
      S4 乘上预留比例。判定用作者口径的 0.5, 同时报告不预留(1.0)的值。
      S5 计算 R1 = GPU数 x tokens/$ x (1/6000) x 0.5。
      判定:
        hit       = R1 >= 1e7
        partial   = 1e6 <= R1 < 1e7
        miss      = R1 < 1e6
        ambiguous = 推理 GPU 总量无法获得可信估计(公共云不披露推理/训练拆分)

    [误差传播要求]
      必须报告对数域的误差条: 每级给出 [lo, mid, hi] 三值, 合成后给出
      Total 的 90% 区间。若区间跨越 1e7 这个判定边界, 结论须标注
      "边界内不确定", 不得单点定案。

    [组内关系 —— C12 与 C13/C14 构成一条因果链]
      本组(G2_automation_chain)的因果结构是:
        C12(有多少个等价研究员) -> C13(它们能把算法进展压缩多少) -> C14(所以何时超智能)
      前一条的量是后一条的前提。判定必须按此顺序, 且后一条判 hit 时
      须先确认前一条判 hit; 若 C12 判 miss, C13 的 hit 需另行解释
      (可以是"少数极强代理"而非"海量代理", 那是另一条路径)。

    [排除项]
      E1 用训练算力替代推理算力: 作者明说推理 fleet 应远大于训练集群。混用会低估。
      E2 用理论峰值 FLOPs 替代实际 token 吞吐: 须用实测吞吐(MFU x 理论峰值)。
      E3 用厂商"可支持"的并发数替代实际可运行数: 须是可长期满负荷运行的量。
      E4 直接用 API 标价推算 tokens/$ 而不剥离 batch 折扣、缓存折扣、订阅补贴:
         这三项在 2024-2026 已使实际有效价格大幅低于标价。
- id: C13
  section: II
  page: 47
  quote: Automated AI research could probably compress a human-decade of algorithmic progress into less
    than a year (and that seems conservative). That'd be 5+ OOMs
  claim_type: capability_milestone
  author_magnitude: 1 年内获得 5 OOM 算法进展(压缩十倍)
  observable: 自动化研究系统对"同等算法进展所需人年"的压缩比
  threshold: '>= 3x compression (i.e. >= 3 human-years of algorithmic progress delivered within 1 calendar year)'
  direction: '>='
  due: '2028-12-31'
  decisiveness: low
  notes: '原文说 10x 压缩(十年压到一年), 本审计锁 3x。理由: "人类十年算法进展"这个分母本身无法标定 —— 十年是哪个十年? 进展如何度量? 故先降级为"是否存在可复现的 3 倍压缩实例", 并强制要求分母定义为"同一组织在前一时期的人年产出"。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  group: G2_automation_chain
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06 至 2028-12-31。

    [原文的说法与它不可判定的原因]
      原文(p.47): "Automated AI research could probably compress a human-decade of
      algorithmic progress into less than a year (and that seems conservative).
      That'd be 5+ OOMs, another GPT-2-to-GPT-4 ..."
      三个不可判定的成分:
        U1 "a human-decade of algorithmic progress" —— 分母未标定。
           是 2014-2024 的十年? 还是 2024-2034 的十年? 若取历史十年,
           该十年的进展已被观测到, 但那是人类做的, 不能作为"压缩"的对象。
        U2 "algorithmic progress" 的度量 —— 用 OOM/年? 用基准分数?
           C04 的教训是: 算法效率估计随基准+阈值可变动 10 倍。
        U3 "could probably ... and that seems conservative" —— 双重弱化,
           且"保守"一词使该断言在方向上不可错(说少了算保守, 说多了算乐观),
           等于没有可证伪的边界。

    [本审计的降级方案 —— 换成可比的压缩比]
      定义可测量的量:
        压缩比 K = (自动化系统在 1 个日历年内的算法进展) / (同一组织在
                   前一可比时期内、纯人类团队的年均算法进展)
      要求:
        K1 分子与分母必须用同一度量(同一基准+阈值, 或同一 OOM 折算方法)。
        K2 "同一组织"是为了控制资源差异 —— 否则进步可能来自更多算力而非自动化。
        K3 "前一可比时期"取紧邻的、未使用自动化研究系统的时期(如 12-24 个月窗口)。
        K4 必须能排除"进展来自更多算力/更多人力"这一替代解释:
           须报告算力与人力的变化量, 并在回归中控制。
      hit 门槛: K >= 3 (作者是 10, 本审计锁 3, 见下)。

    [为什么锁 3x 而不是 10x]
      R1 分母不可靠: 作者的口径是"人类十年", 而任何可比窗口都短得多; 用短窗口
         估出的年化速率对窗口选择极敏感(C03 已展示同类问题)。
      R2 作者自称"保守": 若 10x 是保守估计, 那么断言的真实下限应当更高;
         但正因为"保守"使其不可证伪, 本审计只能取一个更低的、可证伪的门槛。
      R3 3x 已足够区分"自动化带来质变"与"自动化只是常规提速":
         若无自动化, 靠人力扩张也能达到 1.5-2x; 3x 需要结构性改变。
      锁 3x 是对作者的实质宽松化(其量级为 10x), 须在判定记录中说明。

    [主判据 P1]
      S1 选定一个可回溯的算法进展度量(建议: C04 的三个冻结基准之一),
         并在判定前把该度量在分母期的取值固定下来。
      S2 记录分母期该组织的算力投入、研究人员数、以及该期的进展速率 v_human。
      S3 记录分子期(引入自动化研究系统后)的算力投入、研究人员数、进展速率 v_auto。
      S4 计算 K_raw = v_auto / v_human; 再用算力与人力变化做归一: K = K_raw / (算力倍数 x 人力倍数)。
      判定:
        hit       = K >= 3
        partial   = 1.5 <= K < 3
        miss      = K < 1.5
        ambiguous = 分母期数据缺失, 或分子期与分母期的度量口径不一致

    [与 C12 的依赖关系 —— 本组的因果链约束]
      C13 的规模前提是"有多少个等价研究员"。若 C12 判 hit(>= 1e7 等价物),
      则 C13 的加速在机制上有了支撑; 若 C12 判 miss, C13 仍可能 hit,
      但解释必须改为"少数极强代理 + 更长测试时算力", 而不是"海量并行"。
      两种情形的判定结论相同但机制解释不同, 判定记录须明确是哪一种。

    [排除项]
      E1 把"代理提交速度快 10 倍"当作研究加速: 速度不等于进展速率,
         RE-Bench 已显示快 10 倍而得分接近 0。
      E2 把"论文产出数量"当作算法进展: 数量可灌水, 须用基准改进或 OOM 折算。
      E3 把一次性范式突破当作速率: 单次突破应作为离群点, 不计入年化速率。
      E4 未经算力/人力归一: 直接把进步全归给自动化, 是本条最常见的误判。
- id: C14
  section: II
  page: 63
  quote: '2027/28: Proto-automated-researchers, can automate >90% ... 2028/29: 10x+ pace of progress →
    superintelligence'
  claim_type: capability_milestone
  author_magnitude: 2027/28 自动化 >90%; 2028/29 进入超智能
  observable: 分段判定 —— 阶段一(>90% 自动化)用任务覆盖率的加权; 阶段二(超智能)用 C13 的加速比 >= 10
  threshold: 'Stage-1: >= 90% weighted task-coverage of AI-research subtasks by 2028-12-31; Stage-2: >= 10x compression (C13 scale) by 2029-12-31'
  direction: '>='
  due: '2029-12-31'
  decisiveness: low
  notes: '本条是两个阶段的时间表, 必须拆判。阶段一定义为"研究子任务的加权覆盖率 >= 90%"(须先列出子任务清单并给权重); 阶段二直接引用 C13 的 K >= 10。超智能本身无公认定义, 本审计不试图判"是否超智能", 只判作者给定的操作化条件。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  group: G2_automation_chain
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06 至 2029-12-31。

    [原文是一段阶梯式时间表, 不是一个断言]
      原文(p.63):
        "... Speeds up work by 1.5x-2x already; progress begins gradually accelerating."
        "• 2027/28: Proto-automated-researchers, can automate >90%. Some remaining
           human bottlenecks, and hiccups in coordinating a giant organization of
           automated researchers to be worked out, but this already speeds up
           progress by 3x+. This quickly does the remaining necessary 'unhobbling'
           takes us the remainder of the way to 100% automation."
        "• 2028/29: 10x+ pace of progress → superintelligence."
      三个时间点、三个量: 当前 1.5-2x; 2027/28 自动化 >90% 且 3x+ 加速;
      2028/29 10x+ 加速并进入超智能。本审计只判后两个, 且必须分成两个阶段。

    [阶段一: "automate >90%" —— 必须先造分母]
      ">90%" 的 90% 指什么, 原文没有定义。可能的读法至少有三种:
        (a) 研究工作中按时间计的 90%(即 90% 的工作小时可由代理完成);
        (b) 按子任务种类计的 90%(90% 的环节有代理可用, 无论质量);
        (c) 按产出价值计的 90%。
      三种读法的门槛差别极大, 且 (c) 几乎不可测。
      本协议采用 (b) 的加权形式, 因为它是三者中最可核对的:
        步骤 1 在判定前(建议 2026-12-31 前)公开列出一份 AI 研究子任务清单,
               建议 15-25 项, 覆盖: 文献调研、假设生成、实验设计、代码实现、
               调试、结果分析、消融实验、论文写作、审稿回应、算力调度、数据清洗。
        步骤 2 给每项一个公开权重。权重建议按"该环节在典型研究项目中的时间占比",
               由独立第三方(非模型厂商)设定。
        步骤 3 判定时逐项核对: 该子任务是否可由代理在无人干预下完成且质量达标。
               质量达标须有独立复核, 不接受厂商自评。
        coverage = 权重和(已达标子任务)
      hit(阶段一) = coverage >= 0.90 且 在 2028-12-31 前

    [为什么必须在判定前就公开清单与权重]
      这是本条唯一防止事后挪动门槛的办法。若等到 2028 年再定"90% 指什么",
      则任何结果都可被解释为达标或未达标。故本协议要求在 2026-12-31 前
      完成清单与权重的公开登记, 并把该登记文件纳入封存。
      若判定时发现清单未按期登记, 阶段一记 ambiguous。

    [阶段二: "10x+ pace of progress → superintelligence"]
      这一句把两个东西合成了一句: 加速比 10x, 以及"于是超智能"。
      本审计的处理:
        P1 只判加速比, 且直接引用 C13 的判定方法, 门槛提到 K >= 10
           (作者原量级, 不打折; 因为阶段二本就是作者的最大胆断言)。
        P2 "超智能" 本身不判。"superintelligence" 在全书没有操作化定义,
           作者用的是类比("像我们比小学生聪明那样")。本审计拒绝为该词造定义,
           因为任何定义都会引入本审计自己的立场。
        P3 因此阶段二的判定表述必须是: "作者给定的操作化条件(10x 加速)是否成立",
           而不是 "是否到达超智能"。这一区分须写进最终结论句。

    [判定 —— 三档合并]
      设 S1 = 阶段一是否达标, S2 = 阶段二是否达标:
        hit       = S1 且 S2
        partial   = 仅 S1 达标(自动化做成了, 但没有 10x 加速)
        miss      = S1 未达标(自动化本身没到 90%)
        ambiguous = 阶段一子任务清单未按期登记; 或 C13 判 ambiguous
      注意: 本条的 hit 需要 S1 与 S2 同时成立, 这是本表最苛刻的复合条件之一。
      partial 的含义是"作者的时间表前半对了, 后半错了", 这在实践中是最可能的落点。

    [与 C12/C13 的组内依赖]
      G2 链条: C12(规模) -> C13(压缩比) -> C14(时间表)。
      C14 的两个阶段分别对应:
        阶段一(90% 自动化) 需要 C12 的规模作为物质基础;
        阶段二(10x 加速) 直接是 C13 的 K 值提高门槛。
      若 C13 判 miss, C14 的阶段二自动 miss, 但仍须独立判阶段一。

