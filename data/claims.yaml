- id: C17
  section: IIIa
  page: 80
  quote: '~2028: ~$2T annual investment, ~100M accelerator shipments, 20% of US electricity, ~100% of leading-edge TSMC capacity'
  claim_type: quantitative_trend
  author_magnitude: 2028 年全球 AI 年投资约 2 万亿美元(同页另有 1 亿加速器出货、美国 20% 电力、台积电先进制程 100%)
  observable: '口径锁定后的年度合计 —— 四大 hyperscaler capex + neocloud + 主权基金 AI capex + AI 专用数据中心相关电力基建'
  threshold: '>= $1.0T annual AI-related capex in 2028 (author: ~$2T)'
  direction: '>='
  due: '2028-12-31'
  decisiveness: medium
  notes: '本审计锁 1 万亿而非 2 万亿。理由: 该页四个数字(2 万亿投资、1 亿加速器、20% 美国电力、100% 台积电)是同一个"~2028"场景的四个侧面, 彼此应一致; 而按 2027 年接近 1 万亿的公开指引, 2028 达 2 万亿需再翻倍, 与"电力是约束"这一作者自己的判断相冲突。锁 1 万亿并同时校验四个数字的内部一致性。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06 至 2028-12-31。

    [原文是四个数字的场景, 不是一个数]
      原文(p.80): "~2028: ~$2T annual investment, ~100M accelerator shipments,
      20% of US electricity, ~100% of leading-edge TSMC capacity"
      四个数彼此耦合, 必须一起校验, 不能只挑投资额:
        N1 ~$2T 年投资
        N2 ~1 亿加速器出货/年
        N3 占美国电力 20%
        N4 占用台积电先进制程 ~100% 产能
      这四个数是同一个物理量的不同侧面(钱 -> 芯片 -> 电 -> 代工产能)。
      若四者中出现明显不一致, 说明该场景本身不自洽, 判定须指出是哪一项先崩。

    [为什么本审计锁 1 万亿而非 2 万亿]
      R1 与作者自己的约束判断冲突: 作者在 p.77 主张"电力是首要瓶颈"(C18)。
         若电力确实是约束, 则投资额不可能在 2027 到 2028 一年内再翻倍到 2 万亿 ——
         瓶颈部门的物理产出增速不支持这种资金投放。
      R2 公开指引的锚点: 2026 年四大 hyperscaler capex 指引约 7250 亿美元
         (同比 +77%), 含 Oracle/neocloud/主权基金后 2026 年合计首破 1 万亿;
         Moody's 预测 2027 年接近 1 万亿。从 1 万亿到 2 万亿需再翻倍,
         而电力侧的交付节奏(变压器交期约 5 年、并网 5-7 年)不支持。
      R3 锁 1 万亿仍是显著宽松化(作者 2 万亿的一半), 且 1 万亿本身已是
         历史极值量级。若连 1 万亿都未达, miss 结论很强。
      因此 hit 门槛 = 2028 年 AI 相关 capex >= 1.0 万亿(作者量的一半)。

    [口径必须锁死 —— 这是本条最大的判定风险]
      作者的 2 万亿包含什么? 原文未明确。本协议锁以下口径:
        计入: 四大 hyperscaler 的 AI 相关 capex; neocloud(GPU 云)capex;
              主权基金 AI 专项 capex; AI 专用数据中心的电力与冷却基建投资。
        不计入: 通用云业务的非 AI 部分; 存量设备替换(除非明确为 AI 扩容);
                企业侧采购 AI 服务的运营支出(OPEX); 终端设备与消费级芯片;
                与 AI 无关的电网升级投资(即便由 AI 需求触发, 也须单列旁证)。
      须在判定记录中给出上述每一类的金额与来源, 再求和。若某类无法拆分,
      须说明该类的估计方法与不确定性。

    [四数字一致性校验(必须执行)]
      X1 投资额 -> 加速器出货: 以 2028 年主流加速器均价(含 HBM 与网络)推算
         1 万亿可买多少台, 与 1 亿台比较。若相差超过 3 倍, 记录不一致。
      X2 加速器 -> 电力: 以单加速器含 PUE 后的平均功率推算 1 亿台的装机功率,
         与"美国 20% 电力"比较。若相差超过 3 倍, 记录不一致。
      X3 加速器 -> 台积电产能: 以单颗芯片的晶圆面积与 2028 年先进制程有效产能
         推算能否供给 1 亿颗, 与"~100% 产能"比较。
      一致性校验的结果不直接决定 hit/miss(那由投资额单独决定), 但必须报告:
      若四个数中任一明显不成立, 则该断言即使在投资额上命中, 也须标注
      "场景内部不自洽"。

    [判定]
      hit       = 2028 年口径内 capex >= 1.0 万亿
      partial   = 0.5 <= capex < 1.0 万亿
      miss      = capex < 0.5 万亿
      ambiguous = 口径无法拆分(如 hyperscaler 不再单列 AI capex)

    [排除项]
      E1 用"计划投资"替代"实际支出": 须用已发生的 capex 或财年指引区间, 不用多年规划总额。
      E2 把多年承诺一次性计入某一年: 如 10 年 4 万亿的框架协议, 不能算作单年 4000 亿。
      E3 混入 OPEX 与融资额: 融资额不是投资额; 运营支出不是资本支出。
      E4 用全球数据中心总市场(含非 AI)替代 AI 相关 capex。
- id: C18
  section: IIIa
  page: 77
  quote: 'Power has become the binding constraint ... Where do I find 10GW?'
  claim_type: structural
  author_magnitude: 电力(而非资本、而非芯片)是首要约束
  observable: 主要 AI 数据中心项目的公开延期/取消原因分类统计中, 「电力与并网」是否居首
  threshold: '== power/grid is the single most-cited binding constraint across >= 60% of documented delay or capacity-shortfall cases through 2028-12-31'
  direction: '=='
