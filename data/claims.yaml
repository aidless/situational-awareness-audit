- id: C06
  section: I
  page: 30
  quote: an RLHF'd small model was equivalent to a non-RLHF'd >100x larger model in terms of human rater
    preference
  claim_type: conversion_factor
  author_magnitude: RLHF ≈ 100 倍算力
  observable: 同架构同数据下, RLHF 与未 RLHF 模型在固定偏好评判下的等效规模倍率(以参数量的 log10 差折算)
  threshold: '>= 1.0 OOM equivalent (i.e. >= 10x) at matched preference-judge'
  direction: '>='
  due: '2027-12-31'
  decisiveness: low
  source_tier: A
  notes: '原文是 >100x(即 >2 OOM), 本审计只锁 >= 1 OOM 下限。理由: 100x 单点来自 InstructGPT 一次实验的偏好胜率外推, 而"等效规模"本身依赖评判者与提示分布; 用 1 OOM 作 hit 门槛是显著宽松化, 必须在判定时说明。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  group: G1_conversion_rates
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06 至 2027-12-31。

    [原文链条 —— 数字是怎么来的]
      原文(p.30)引的是 InstructGPT 的人类评分实验:
        "an RLHF'd small model was equivalent to a non-RLHF'd >100x larger model
         in terms of human rater preference"
      折算方式(隐含): 在固定偏好胜率下, RLHF 模型参数量小 100 倍仍能打平,
      故等价于 100 倍参数量, 近似当作 100 倍算力(在 Chinchilla 式等 token 假设下)。
      这个 100x 不是直接测量, 而是"偏好胜率 -> 规模等效"的外推, 顶多算一个点估计。

    [为何本审计只锁 1 OOM 而非 100 倍(2 OOM)]
      三个理由, 缺一不可地写进判定记录:
        R1 单实验外推: InstructGPT 的 100x 是 2022 年一组实验的一个切片,
           未见跨模型族、跨评判者、跨提示分布的复现。
        R2 评判者依赖: "等效规模"在人类偏好与在强模型自动评判下并不相同;
           若 2026 年后评测主要由模型承担, 该折算率可能整体漂移。
        R3 收益递减: RLHF 的偏好提升有饱和上限(无法提升到超过评判者偏好),
           随基座变强, RLHF 的边际折算率会下降。
      故 hit 门槛设 1 OOM(10x) 已是宽松化;作者若真如 100x 所述, 应大幅超过此门槛。

    [主判据 P1 复现步骤]
      S1 固定一个偏好评判者(建议: 人类标注 + 一个冻结的强模型评判, 双轨各报一次)。
      S2 同一模型族、同一预训练数据、同一 token 预算下, 比较
         (a) 基座模型 (b) 同族经 RLHF 后的模型, 在固定提示集上的胜率。
      S3 用该族的规模-能力曲线(至少 4 个不同参数量点)反查: 基座模型需要放大多少倍
         才能达到 (b) 的胜率。该倍数的 log10 即折算率(OOM)。
      S4 两个评判者轨道各算一次, 取较小值作为 R1(偏保守)。
      判定:
        hit       = R1 >= 1.0 OOM (>= 10x)
        partial   = 0.5 <= R1 < 1.0 OOM
        miss      = R1 < 0.5 OOM
        ambiguous = 规模-能力曲线在目标胜率处已饱和(无法反查放大倍数)

    [排除项 E1 混入 SFT 与数据质量]
      RLHF 通常伴随 SFT 与指令数据配比变化。若对照未分离 SFT, 折算率会把
      SFT 的贡献一并算给 RLHF。须设至少三臂: 基座 / 仅 SFT / SFT+RLHF。

    [排除项 E2 评判者饱和]
      若胜率逼近 100%, 规模-能力曲线在顶端变平, 反查放大倍数会爆炸。
      此时须改用更难提示集, 或声明该点不可用。

    [组内关系 —— 见 C02 的组汇总判据]
      G1 组的四条(C06 C07 C08 C11)+ C09 共同支撑 C02 的 3-6 OOM 总数。
      正确判法是加总(见 C02 协议), 不是逐条平均。本条单独判 low 可判定性,
      但在组内它的作用是提供"对齐折算率"这一轴的量级。
