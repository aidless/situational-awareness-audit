      partial   = 中位数落在 [35, 50) 或 (200, 285] 内   —— 记 0.5 分(偏差 2-3 倍)
      miss      = 中位数 < 35 或 > 285 tokens/min
      ambiguous = 被试内部离散度(四分位距)超过中位数本身, 说明「人类思维速率」不是一个稳定的类量

