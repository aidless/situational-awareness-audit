- id: C15
  section: II
  page: 54
  quote: Perhaps 2026/27-models speed are the proto-automated-researcher, it takes another year or two
    for some final unhobbling ... to get to full automation
  claim_type: capability_milestone
  author_magnitude: '2026/27 出现「原型自动化研究员」: 能自动化约 70-90% 的 AI 研究工作, 但在最后一段仍需人类介入'
  observable: 是否存在一个独立可复现的 AI 研究代理系统, 在开放式 ML 研究工程任务上达到或超过人类专家基线
  threshold: '>= 1.0x at 8h budget (agent >= human expert score on RE-Bench 8h tasks, median across task pairs)'
  direction: '>='
  due: '2027-06-30'
  decisiveness: high
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  resolution_protocol: |
    判定窗口: 2026-01-01 至 2027-06-30。

    本条的阈值是两个数字, 必须同时满足才判 hit:
      T1 能力比 >= 1.0  —— 在 METR RE-Bench(或后续版本)上, 最佳代理在总预算 8 小时条件下的
                           score@k 不低于人类专家 8 小时条件的中位数。
                           参照点: RE-Bench v1 结论为 2 小时预算下代理达人类 4 倍, 8 小时略低于人类,
                           32 小时人类达代理 2 倍。T1 = 1.0 即"8 小时预算追平人类"。
      T2 独立性 = 是     —— 该成绩必须来自第三方机构(METR / AISI 等)或公开可复现的开源评测,
                           且任务集不为此前训练集的重合集。

    [为何不用「时间视野」作主判据] METR 时间视野(TH)测的是"能以固定成功率完成多长的人类任务",
      主要覆盖自包含、可自动评分的软件/ML/安全任务, 且官方明确标注 >16 小时的估计不可靠。
      而作者的 "automated AI researcher" 指开放式研究: 提假设、设计实验、解读结果、迭代。
      TH 只能检验"能不能连续干活", 不能检验"能不能做研究"。故 TH 仅列为 P3 旁证。

    [旁证 P3, 不参与判定]
      METR TH 1.1(截至 2026-09-08): 前沿模型的 50% 时间视野已进入 4-16 小时区间,
        低于 2024 年 3 月时(约 5 分钟)已提升约两个数量级, 年均倍增周期约 7 个月。
      这支持"能连续干活", 但不支持"能做开放式研究"。

    [判定规则]
      hit       = 存在至少 1 个系统同时满足 T1 与 T2, 且在窗口内被公开报告。
      partial   = 存在系统在 2 小时预算下显著超过人类(如 RE-Bench v1 的 4 倍)
                  但 8 小时预算下未追平 —— 记 0.5 分, 不计作 hit。
      miss      = 窗口结束时无任何系统满足 T1。
      ambiguous = 出现声称满足 T1 的结果但无法复现, 或评测方与被评测方存在未披露的资助关系。

    [预注册时点的方向性判断] 依 RE-Bench v1 已公开的结论(2h: 代理 4 倍 / 8h: 人类略胜 /
      32h: 人类 2 倍), 当前应判 partial。作者原文给自己的留白是"2026/27 模型速度是原型",
      且明确说"再要一到两年才到完全自动化" —— 因此本条即便 partial 也不算对作者的否定,
      它检验的是"原型自动化研究员"这个中间阶段是否按他给的时间表出现。

    [明确排除的证据类型] 以下不得作为 hit 证据:
      - 实验室自述"我们的系统能加速研究"(无人类基线的对照)
      - 基准分数的自我报告, 且无第三方复现
      - 只在自建任务集上成立、任务集未公开的结果
      - "代理比人类快 10 倍提交方案"(速度 ≠ 质量; RE-Bench 原文记录代理提交快 10 倍以上
        但多数方案得分接近 0)
  notes: 这是全表最容易被误判的一条。2026 年的公开叙事里, agent 能跑完研究流程常被等同于能做研究, 但 RE-Bench 的原始设计正是为了区分这两件事。锁定时特别排除了「速度类」证据。
- id: C16
  section: IIIa
