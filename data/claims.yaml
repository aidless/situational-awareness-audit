      作者自己承认这是 "just a rough order of magnitude estimate, e.g. consider your internal monologue"。
      全链条里, 100 tokens/min 是**唯一一个从未被任何文献测量过的数** —— 其它输入
      (GPU 数、$/token、40 小时/周)都有出处。本条就是补测这个分母。

    [为什么方向是 in_range 而不是 >=]
      这是本轮唯一一条「双向」阈值。人的思维速率过快或过慢都同样推翻作者的换算:
        - 若实测远快于 100 tokens/min, 则人类每小时消耗的 token 更多, 1 亿等效研究者被高估
        - 若实测远慢于 100 tokens/min, 则等效研究者被低估, 但 Table 2 的「1 万 token = 半个工作日」
          也随之失真, 时间映射整体错位
      所以判据是**是否落在 50-200 区间内**(即作者说的 "rough order of magnitude" 容差, 上下各 2 倍),
      而不是单调方向。

    [主判据 P1: 可复现的自测量]
      本断言不接受二手引用, 必须由本审计执行一次小型实证并公开全部原始数据与脚本。协议:
