meta:
  source: 'Aschenbrenner, L. (2024). Situational Awareness: The Decade Ahead. situational-awareness.ai'
  source_sha256_file: raw/sa_full.pdf
  extraction_date: '2026-10-24'
  total_claims: 24
  design_note: |
    本表是预注册的前瞻性预测审计骨架, 不是对作者的辩护或反驳。 每条断言给出: 原文页码、作者的原始量级、可观测代理量、判定方向、到期日。 「折算率」字段单独列出所有把异质量纲折成有效算力 OOM 的倍数, 及其来源级别。 source_tier: A=同行评审/官方统计, B=机构估算(Epoch/METR/SemiAnalysis), C=作者自述或私人通信, D=传闻/推测
claims:
- id: C01
  section: I
  page: 8
  quote: it is strikingly plausible that by 2027, models will be able to do the work of an AI researcher/engineer
  claim_type: capability_milestone
  author_magnitude: AGI(可替代 AI 研究员) 于 2027 年
  observable: 双轨 —— (A) METR 时间视野 50% 达 >= 8 小时且 80% 达 >= 2 小时; (B) 完成一项预先登记的、非自选的完整 AI 研究工程闭环
  threshold: '>= 8h at 50% horizon AND >= 2h at 80% horizon, on a METR suite >= v1.1 explicitly declared non-saturated for the evaluated models'
  direction: '>='
  due: '2027-12-31'
  decisiveness: high
  notes: '作者的原话是"能做 AI 研究员/工程师的工作", 且他自定标准为"能完全自动化我或我朋友的工作"。本审计锁的是该标准的下限操作化, 不是 AGI 全域。关键约束: METR 自承 16 小时以上估计不可靠, 且该页面已于 2026-09-08 停止维护 —— 判定时必须处理证据源失效。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06 至 2027-12-31。

    [作者原话的三个限定, 必须逐个尊重]
      原文(p.8): "it is **strikingly plausible** that by 2027, models will be able to
      do the work of an AI researcher/engineer. That doesn't require believing in
      sci-fi; it just requires believing in straight lines on a graph."
      三个限定:
        L1 "strikingly plausible" —— 是概率判断, 不是确定性断言。
           因此本条判 miss 不等于作者错, 只等于"这条概率判断未被兑现"。
        L2 "do the work of an AI researcher/engineer" —— 锚定在职业工作,
           不是"通用智能"、"通过图灵测试"、"自主目标"等更宽的 AGI 定义。
        L3 作者自定标准: "能完全自动化我或我朋友的工作"。
      本协议只操作化 L2/L3 的下限, 不试图判 AGI 全域。任何把本条读成
      "AGI 到没到" 的判定, 都是扩大了断言范围。

    [为什么用双轨 —— 单轨必然给出误判]
      轨道 A(METR 时间视野) 的优点是可复现、有公开排行榜;
      缺点有三, 且都已被 METR 自己书面承认:
        W1 超过 ~16 小时的估计不可靠(扩展后的套件里, 最新模型失败的题太少)。
        W2 任务"脏度"不足: HCAST/RE-Bench 任务在 METR 自建的 16 分脏度量表上
           均值 3.2, 无一题超过 8; 而"写一篇好的研究论文"会被评为 9-15。
           在套件最脏的一半上, 没有任何模型超过 30% 成功率。
        W3 领域不均: 数学与软件相近, 但视觉电脑操作类时间视野低 40-100 倍。
      轨道 B(完整闭环) 是为了补 W2 —— 它衡量的正是"脏"工作。
      但轨道 B 的主观性高, 故只作必要条件, 不与 A 做加权平均。

    [轨道 A 的具体阈值与理由]
      阈值: 50% horizon >= 8 小时 且 80% horizon >= 2 小时。
      依据:
        A1 8 小时 = 一个完整工作日。作者说的是"做研究员的工作", 而研究员的工作
           单位是天, 不是分钟。取 8 小时是"一日工作可交付"的下限。
        A2 同时要求 80% horizon >= 2 小时, 是为了防止 50% 单点虚高。
           METR 自己指出 80% horizon 通常比 50% 低 3-5 倍; 若只报 50%,
           一个"偶尔能做长任务但普遍不可靠"的模型会被误判为达标。
        A3 必须使用未被判定为饱和的套件版本(>= v1.1), 且判定时须记录
           该版本对被测模型是否已饱和。若 METR 维持"16 小时以上不可靠"的
           声明, 而模型已超出该范围, 则轨道 A 记 ambiguous。

    [轨道 A 的数据源失效问题 —— 本协议最特殊的约束]
      事实: METR 的 time-horizons 页面已于 2026-09-08 停止积极维护,
      最新收录模型为 2026-04 的 Claude Mythos Preview 早期版本。
      这意味着到 2027-12-31 判定时, 轨道 A 很可能没有官方更新数据。
      处理规则(必须择一执行并在记录中声明):
        F1 若 METR 恢复更新或发布新套件: 直接用官方值。
        F2 若 METR 未恢复: 允许使用第三方复现(须公开任务集、脚本、逐题结果),
           但必须在记录中标注"非 METR 官方, 第三方复现", 并同时报告
           该项目与 METR 方法的一致性检验结果。
        F3 若既无官方更新也无合格第三方复现: 轨道 A 记 unavailable,
           此时整条判定的最终判定降级为 partial(最多),
           因为双轨只剩一轨, 无法满足 hit 的必要条件。
      F3 是对作者不利的降级, 但这是证据可得性问题, 不是断言强度问题;
      须在判定记录中明确区分。

    [轨道 B 的具体定义 —— 防止事后自选]
      要求完成至少一项在 2026-12-31 之前预登记的完整闭环, 且满足:
        B1 任务由第三方(非模型厂商、非本审计作者)设定并公开, 含明确的成功判据。
        B2 覆盖"脏"特征至少三项: 模糊的成功标准、不可撤销的操作、
           需要从先前工作获取上下文、跨系统信息散落。
        B3 全程无人干预(允许工具与检索, 不允许人类纠错)。
        B4 结果须有独立复核, 不能只由厂商自评。
      示例(仅作说明, 判定时不必限于此): 给定一个真实实验室的开源仓库与
      一个待解决的开放问题, 要求产出可合并的 PR + 实验报告 + 复现脚本,
      由原作者或独立第三方验收。

    [判定]
      hit       = A 达标 且 B 至少一项成立, 且在 2027-12-31 前
      partial   = A 达标但 B 无合格实例; 或 B 有实例但 A 仅达 50% horizon >= 4h
      miss      = A 的 50% horizon < 4h (低于半日), 无论 B 如何
      ambiguous = 轨道 A 记 unavailable(见 F3), 或套件饱和导致 A 无法定值
      注意: partial 的两种情形含义不同 —— 前者是"跑得长但做不好脏活",
      后者是"做得好脏活但不稳定"。判定记录须指明是哪一种。

    [与 C09 / C15 的关系 —— 不要重复判]
      C09(同基座 unhobbling 8x) 与 C15(原型自动化研究员) 都是本条的上游证据,
      但三者断言的量不同:
        C09 判"同一基座经后训练能提升多少", 是通道存在性;
        C15 判"2026 年是否已有原型", 是阶段性里程碑;
        C01 判"2027 年底能否承担研究员的工作", 是终点。
      本条判定时可直接引用 C09/C15 的结论作为旁证, 但不得以其达标替代本条判据。

    [排除项]
      E1 速度类证据: "代理提交比人类快 10 倍" 不计入。RE-Bench 记录代理快 10 倍以上、
         成本 123 美元 vs 人类 1855 美元, 但多数方案得分接近 0。
      E2 自选任务: 厂商或代理方自己挑的 demo 案例不计入轨道 B。
      E3 窄域周级运行: 单一领域内的长程成功(如某次七天的 kernel 优化)
         不构成"研究员/工程师的工作"这一泛化主张, 只在轨道 B 中作旁证。
      E4 峰会/路线图声明: 厂商宣称"将达到"不计入, 必须有可复现测量。
- id: C02
  section: I
  page: 9
  quote: we should expect another ~100,000x effective compute scaleup over four years
  claim_type: quantitative_trend
  author_magnitude: '相对 GPT-4 +5 OOM 有效算力(约 10 万倍), 区间 3-6 OOM'
  observable: '组汇总 —— 物理算力轴(C03) + 算法轴(C04) + unhobbling 轴(C06/C07/C08/C09/C11) 按同一 OOM 刻度加总'
  threshold: '>= 3.0 OOM total effective compute gain vs GPT-4 by 2027-12-31 (author band 3-6, best guess 5)'
  direction: '>='
  due: '2027-12-31'
  decisiveness: medium
  notes: '本条是全书的总账, 也是唯一必须"加总"而非"逐条判"的一条。锁 >= 3 OOM(区间下沿)而不是 5: 因为三轴加总有重复计数风险, 用下沿是对作者有利的宽松化; 但必须同时报告落在 3-6 区间内还是区间外。'
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  group: G0_total_account
  aggregated_from: 'C03, C04, C06, C07, C08, C09, C11'
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06 至 2027-12-31。

    [本条是全书的总结账, 不是一个独立测量]
      原文(p.9): "we should expect another ~100,000x effective compute scaleup
      over four years" (= 5 OOM)。作者在别处给出的区间是 3-6 OOM, 最佳 5。
      这个数不是测出来的, 是把三条轴相加得来的:
        轴 1 物理算力      -> 由 C03 判定(训练算力斜率, 默认 0.5 OOM/年)
        轴 2 算法效率      -> 由 C04 判定(累计, 默认 2 OOM vs GPT-4)
        轴 3 unhobbling    -> 由 C06 C07 C08 C09 C11 共同支撑
      因此 C02 的判定必须等 C03/C04/G1 全部判完之后才能做, 不能提前下结论。

    [加总规则 R_sum —— 这是本条协议的核心]
      统一刻度: 全部换算为 log10(等效算力倍率), 单位 OOM, 相对 GPT-4 基线(2023-03)。
      加总公式:
        Total = A_phys + A_algo + A_unhob
      其中:
        A_phys  = C03 的判定斜率 x (2027-12-31 - 2023-03 的年数, 约 4.8 年)
        A_algo  = C04 的判定累计值(注意: C04 已是累计口径, 不再乘年数)
        A_unhob = G1 组的加总值, 按下面第 3 条去重后得出

    [去重规则 —— 三轴加总最容易出错的地方, 必须逐条执行]
      D1 C03 与 C04 不得重复: C03 是"训练算力每年涨多少", C04 是"达到固定能力
         所需算力累计降多少"。二者是不同轴, 可以相加; 但 C04 若被误锁成斜率口径,
         就会与 C03 计同一个数。本审计已把 C04 锁为累计口径以规避此风险。
      D2 C03 不得重复计硬件性价比: 若 C03 的算力序列已是"有效算力"(按 FLOP/s 美元
         调整), 则芯片性价比改善已内含其中, 不能再单独加。判定记录须写明用的是
         原始 FLOP 还是美元调整后的 FLOP。
      D3 C07 与 C08 必须去重: CoT 在文献中常被归为"脚手架"的一种。
         若 C08 的脚手架规格 S 中已包含思维链, 则 A_unhob 中 C07 的贡献须扣除,
         只取"超出 CoT 的那部分脚手架增益"。判定记录须写明 S 是否含 CoT。
      D4 C09 与 C08 必须去重: C09 的 5%->40% 已包含工具与脚手架收益。
         若 C09 判 hit, 其量级不能再与 C08 全额相加, 只能取二者较大者,
         或按"同一实验内已分离的分量"相加。
      D5 C11 不与任何一条重复: 它是兑换率(测试时 vs 训练时), 是轴内换算系数,
         不是独立的增益来源。严格说 C11 的作用是给 A_unhob 定"每 OOM 测试时算力
         值多少 OOM 训练算力", 因此它应作为乘法系数进入 A_unhob, 而非加法项。
      D6 已计入轴 3 的收益不得再算进 C03/C04: 若某次能力提升来自后训练,
         它同时抬高了"前沿模型的等效算力"与"unhobbling 通道", 只能记一次。

    [判定]
      设 Total 为按上述规则加总后的 OOM 数:
        hit       = Total >= 3.0  且记录中给出三轴分解表
        partial   = 2.0 <= Total < 3.0
        miss      = Total < 2.0
        ambiguous = 任一组成条(C03/C04/G1 任一)判为 ambiguous, 导致 Total 无法定值
      同时必须报告:
        (a) Total 是否落在作者 3-6 OOM 区间内
        (b) Total 与作者最佳猜 5 OOM 的差
        (c) 三轴各自贡献占比 —— 因为作者的论证重心是"轴 3 是主杠杆",
            若 Total 命中但轴 3 占比远低于轴 1+2, 作者的机制主张仍不成立

    [为何 hit 门槛取下沿 3 OOM 而非 5]
      三个理由:
        H1 加总本身有重复计数风险(见 D3/D4), 取下沿可降低"因重复计数而虚高命中";
        H2 作者的 5 是"best guess", 区间 3-6 才是断言边界; 判据应对应断言边界;
        H3 取 3 使本条偏宽松(对作者有利)。若如此宽松仍未达标, miss 结论更强。

    [预注册的方向性判断]
      最可能的走向是 hit(Total 落在 3-6)但机制错位:
      物理轴与算法轴大概率贡献 0.5x4.8 + 2 ≈ 4.4 OOM, 已接近下沿;
      这会让 Total 命中, 却使"unhobbling 是主要杠杆"这一主张落空。
      换言之, 本条最可能的判定结果是"数字对了, 归因错了"。
      这一点必须在判定时明确指出, 因为它是本书论证结构上最脆弱的一环。

    [排除项 E1 事后调轴]
      判定时不得因某轴数据不佳而改用另一轴口径补齐。三轴口径须在 C03/C04/G1
      各自的协议中已锁死, C02 只做加总, 不做口径选择。
- id: C03
  section: I
  page: 21
  quote: training compute used for frontier AI systems has grown at roughly ~0.5 OOMs/year
  claim_type: quantitative_trend
  author_magnitude: 0.5 OOM/年(约 3.16 倍/年)
  observable: Epoch AI 前沿训练算力序列的年度拟合斜率
  threshold: 0.5 OOM/year
  direction: '>='
  due: '2027-12-31'
  decisiveness: high
  notes: 最容易独立可判定的一条, 但也是最容易判错的一条 —— 口径差 0.2 OOM 足以翻转结论。锁定时明确要求「复算作者口径」而非「引用 Epoch 现行值」。作者 0.5 若成立, 其
    2027 年 +2 OOM 的推论才有分母; 若真实全历史斜率只有 0.35, 后续所有外推的乘数效应即失效。
  threshold_locked: '2026-10-24'
  locked_by: liuzewen
  resolution_protocol: |
    判定窗口: 观察期 2024-06-06(原文发布) 至 2027-12-31。

    [核心口径问题: 作者的数字与现在的数字不是同一个拟合]
      作者: "for the last decade and a half ... ~0.5 OOMs/year"
            = 约 2009-2024 全领域(视觉+语言+多模态)全样本拟合。
      Epoch 现行: "5x/year since 2020" = 0.7 OOM/year (90% CI 0.6-0.8),
            仅限 2020 年后的前沿语言模型 top-5。
      两者窗口不同、样本不同。直接比较会得出"作者低估"的结论, 但那个结论
      是口径差造成的, 不是判断失误。因此本条必须"复算作者的数", 不能"引用 Epoch 的数"。

    [主判据 P1 复算口径]
      以 Epoch AI 的公开训练算力数据库为唯一数据源, 复算两次:
        R1 全样本口径: 对 ~2010 年起的 notable models 全样本做 log10(FLOP) ~ 年份 的 OLS,
           取斜率 = 年化 OOM/年。这是作者口径的复现。
        R2 现代口径:   对 2020-01-01 起的前沿语言模型 top-5 做同样的 OLS。
      判定用 R1 的斜率值, 与 0.5 比较:
        hit     = R1 斜率 >= 0.45 (即与 0.5 的差在作者给定的"roughly"之内)
        miss    = R1 斜率 <  0.35
        partial = 0.35 <= R1 斜率 < 0.45            —— 记 0.5 分
        ambiguous = 数据源换版导致 R1 变动超过 0.05, 且新旧版本结论方向相反

    [旁证 P3, 不参与判定]
      Epoch 2026 现行值: 前沿语言模型训练算力 5x/年 = 0.7 OOM/年 (90% CI 0.6-0.8), 倍增 5.2 个月。
      Epoch 另有一处"4.4x/年 since 2010"的历史口径, 约 0.64 OOM/年, 更接近 R1 的复现值。
      若 R1 复算落在 0.5-0.7 区间, 说明作者的数字没有错, 只是用了偏保守的全历史窗口。

    [为何不能直接拿 0.7 判 hit]
      0.7 > 0.5 看似作者保守, 但那 0.7 只覆盖 2020 年后, 而 2020-2024 恰好是
      GPT-3/GPT-4 这一轮超常放量期。用一段超常期的斜率去判一个十五年趋势的断言,
      属于用有利窗口替被检验者"补分"。这在本审计里与"用不利窗口扣分"同罪。

    [判定规则补充]
      - 斜率必须由本审计自行复算并写下数点与样本量, 不得只引用二手结论。
      - 若 Epoch 数据在窗口内更换统计方法(log 底、模型筛选阈值、前沿定义),
        须在判定记录中注明变更, 并同时报告变更前后两个值。
- id: C04
  section: I
  page: 26
  quote: we should expect something like 1-3 OOMs of algorithmic efficiency gains (compared to GPT-4)
    by the end of 2027, maybe with a best guess of ~2 OOMs
  claim_type: quantitative_trend
  author_magnitude: 算法效率 1-3 OOM, 最佳 2
  observable: 分基准复算 —— 达到预设阈值所需算力/成本的累计下降, 折算为相对 GPT-4 的 OOM
  threshold: '>= 2 OOM cumulative vs GPT-4 (partial band [1, 2))'
  direction: '>='
  due: '2027-12-31'
  decisiveness: medium
  notes: '累计口径, 不是斜率口径 —— 原文的 ~0.5 OOM/year 是推导前提, 且与 C03 引用的是同一个数; 若把本条也锁成斜率, OOM 加法里同一输入会被计两次。作者自认这是误差最大的一条(最佳猜 ~2, 区间 1-3)。Epoch 自述算法效率估计随基准+阈值选择可变动约 10 倍, 故必须先钉死基准与阈值再谈数值。API 定价不可单独作代理。'
