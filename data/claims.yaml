      - 任何二手转述的「研究表明人类思维约 X token/分钟」而无法定位原始实验的。
      - 用 LLM 的输出长度反推人类速率(循环论证)。

    [预注册时点的方向性判断]
      无法预判。这正是本条价值所在: 作者在 165 页里给了 100+ 脚注, 唯独这个数字没有出处,
      而它是「1 亿等效研究者」的唯一分母。若实测显著偏离, 受影响的不是某一条子结论,
